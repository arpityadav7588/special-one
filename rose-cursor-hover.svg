<svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24">
  <defs>
    <filter id="hoverGlow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="1" stdDeviation="1" flood-color="#000000" flood-opacity="0.9"/>
      <feDropShadow dx="0" dy="0" stdDeviation="1.2" flood-color="#ffffff" flood-opacity="0.8"/>
    </filter>
  </defs>
  <g filter="url(#hoverGlow)">
    <!-- Stem and Leaf -->
    <path d="M8.5 11.5 C10 14 13 17.5 17.5 21" fill="none" stroke="#ffffff" stroke-width="1.3" stroke-linecap="round"/>
    <path d="M11.5 14.5 C13.5 13 16.5 13.5 17 14.5 C15.5 16 13 16.5 11.5 14.5 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1" stroke-linejoin="round"/>
    <!-- Outer Petals / Calyx (Filled Bloom) -->
    <path d="M3.5 5 C3 8 4.5 10.5 7.5 11.5 C10.5 11 12 8.5 11.5 6 Z" fill="#ffffff" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Rose Cup / Overlap Petal -->
    <path d="M3 4.5 C4.5 2.5 8 2.5 10.5 4.5 C11.5 6.5 10.5 9 8 10 Z" fill="#ffffff" stroke="#090207" stroke-width="0.8" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- Inner Spiral Bloom -->
    <path d="M5.5 4 C6.5 3 8.5 3.2 9 4.8 C9.5 6.5 8 7.8 6.5 7.5 C5.5 7.2 5.5 5.8 6.8 5.2" fill="none" stroke="#090207" stroke-width="0.9" stroke-linecap="round"/>
  </g>
</svg>